name: Daily News

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run news research agent
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: |
          if [ -z "$GROK_API_KEY" ]; then
            echo "GROK_API_KEY not set — skipping live research (Grok automation may still update the repo)."
            exit 0
          fi
          npx tsx scripts/daily-ingest.ts

      - name: Validate data
        run: npm run validate-data || true

      - name: Rebuild indexes
        run: npm run rebuild-index || true

      - name: Commit if changed
        run: |
          git config user.name "AI News Orbit Bot"
          git config user.email "bot@ai-news-orbit.local"
          git add data/
          if git diff --staged --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "chore(news): daily update $(date -u +%Y-%m-%d)"
            git push
          fi
